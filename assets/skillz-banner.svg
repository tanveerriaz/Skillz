<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" role="img" aria-label="Skillz — Reusable AI-agent skills for builders who ship.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1220"/>
      <stop offset="0.55" stop-color="#0F172A"/>
      <stop offset="1" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FBBF24"/>
      <stop offset="0.5" stop-color="#F59E0B"/>
      <stop offset="1" stop-color="#F97316"/>
    </linearGradient>
    <linearGradient id="amberSoft" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FCD34D"/>
      <stop offset="1" stop-color="#F97316"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#FFFFFF" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="14" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .wm { font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif; font-weight: 800; }
      .tg { font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif; font-weight: 600; }
      .sm { font-family: "SFMono-Regular", "JetBrains Mono", Consolas, monospace; font-weight: 600; letter-spacing: 1px; }
    </style>
  </defs>

  <rect width="1280" height="400" fill="url(#bg)"/>
  <rect width="1280" height="400" fill="url(#grid)"/>
  <!-- amber glow accent -->
  <circle cx="1120" cy="120" r="220" fill="#F59E0B" opacity="0.10" filter="url(#glow)"/>
  <circle cx="150" cy="360" r="160" fill="#F97316" opacity="0.08" filter="url(#glow)"/>

  <!-- spark / bolt mark -->
  <g transform="translate(96,150)">
    <rect x="-8" y="-8" width="92" height="92" rx="22" fill="#111B2E" stroke="#F59E0B" stroke-opacity="0.5" stroke-width="2"/>
    <path d="M44 4 L20 44 H38 L32 78 L60 34 H42 Z" fill="url(#amberSoft)" filter="url(#glow)"/>
  </g>

  <!-- wordmark -->
  <text x="214" y="190" class="wm" font-size="104" fill="url(#amber)">Skillz</text>
  <!-- accent underline -->
  <rect x="218" y="208" width="300" height="6" rx="3" fill="url(#amber)"/>

  <!-- tagline -->
  <text x="218" y="262" class="tg" font-size="30" fill="#E2E8F0">Reusable AI-agent skills for builders who ship.</text>

  <!-- meta chips -->
  <g class="sm" font-size="17" fill="#FCD34D">
    <text x="218" y="312">26 SKILLS</text>
    <text x="360" y="312" fill="#94A3B8">·</text>
    <text x="380" y="312">14 CATEGORIES</text>
    <text x="566" y="312" fill="#94A3B8">·</text>
    <text x="586" y="312">CROSS-AGENT</text>
  </g>

  <!-- from prompt chaos to repeatable execution -->
  <text x="218" y="350" class="tg" font-size="16" fill="#64748B">From prompt chaos to repeatable execution.</text>

  <!-- signature -->
  <text x="1184" y="368" text-anchor="end" class="tg" font-size="16" fill="#94A3B8">Curious mind. Builder mode! 🇸🇬</text>
</svg>
